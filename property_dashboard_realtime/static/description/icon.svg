<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="100" height="100" rx="22" fill="url(#gradBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Grid Accent -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="62" x2="80" y2="62" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="20" y1="44" x2="80" y2="44" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Modern Luxury High-Rise Silhouettes -->
  <!-- Tower 1 -->
  <rect x="25" y="38" width="14" height="42" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <rect x="28" y="44" width="3" height="4" rx="1" fill="#64748B"/>
  <rect x="33" y="44" width="3" height="4" rx="1" fill="#64748B"/>
  <rect x="28" y="52" width="3" height="4" rx="1" fill="#64748B"/>
  <rect x="33" y="52" width="3" height="4" rx="1" fill="#64748B"/>
  <rect x="28" y="60" width="3" height="4" rx="1" fill="#64748B"/>
  <rect x="33" y="60" width="3" height="4" rx="1" fill="#64748B"/>

  <!-- Main Center Tower -->
  <rect x="42" y="24" width="17" height="56" rx="4" fill="#0F172A" stroke="url(#gradSky)" stroke-width="1.5"/>
  <rect x="46" y="30" width="3.5" height="4.5" rx="1" fill="#38BDF8" opacity="0.8"/>
  <rect x="52" y="30" width="3.5" height="4.5" rx="1" fill="#38BDF8" opacity="0.8"/>
  <rect x="46" y="38" width="3.5" height="4.5" rx="1" fill="#38BDF8" opacity="0.6"/>
  <rect x="52" y="38" width="3.5" height="4.5" rx="1" fill="#38BDF8" opacity="0.6"/>
  <rect x="46" y="46" width="3.5" height="4.5" rx="1" fill="#38BDF8" opacity="0.4"/>
  <rect x="52" y="46" width="3.5" height="4.5" rx="1" fill="#38BDF8" opacity="0.4"/>

  <!-- Real-Time Dynamic Analytics Graph (Ascending Emerald Wave) -->
  <path d="M 22 72 Q 38 68, 48 50 T 78 30" fill="none" stroke="url(#gradEmerald)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Glowing Data Beacon Points -->
  <circle cx="48" cy="50" r="3.5" fill="#34D399" stroke="#064E3B" stroke-width="1.5"/>
  <circle cx="78" cy="30" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="78" cy="30" r="8" fill="none" stroke="#10B981" stroke-width="1" opacity="0.6"/>

  <!-- Radio / Live Broadcast Waves (Real-Time indicator) -->
  <path d="M 72 18 A 8 8 0 0 1 84 30" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 75 14 A 13 13 0 0 1 89 28" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
</svg>

